name: forja
description: "App de disciplina e foco — NoFap tracker com streak e missões."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navegação
  go_router: ^14.6.3

  # Estado
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Armazenamento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notificações locais
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de código Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
